<div id="loader">
  <div class="loader-logo">E<span>³</span></div>

<div id="title-screen">

<div id="canvas-wrap"></div>

    <div class="card-img-wrap"><img id="card-img" src="" alt="" loading="lazy"><button id="card-close" aria-label="Close">✕</button></div>
    <div class="card-content">
      <div class="card-tag-label" id="card-tag"></div>
      <div class="card-title" id="card-title"></div>
      <div class="card-subtitle" id="card-subtitle"></div>

      <div class="card-tags-row" id="card-tags"></div>

    </div>

  <div class="nav-section-label">Navigate the HQ</div>

  <span class="hud-hint">Pinch to walk · Drag to look</span>

  <span class="hud-hint">Tap panels to explore</span>
</div>
<div id="progress-bar-wrap"><div id="progress-bar"></div></div>
<div id="mini-nav"><div class="mini-nav-inner" id="mini-nav-inner"></div></div>
<div id="touch-hint">
  <div class="touch-hint-icon">🤏</div>
  <div class="touch-hint-label">Pinch to walk forward</div>
</div>

<script defer src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" crossorigin="anonymous"></script>
<script defer src="hq.js"></script>
<script>
// Show touch hint briefly on mobile
if('ontouchstart' in window) {
  var th=document.getElementById('touch-hint');
  setTimeout(function(){ if(th) th.classList.add('show'); }, 3200);
  setTimeout(function(){ if(th) th.classList.remove('show'); }, 6500);
}
// Progress bar visible after entering
window.addEventListener('load',function(){
  setTimeout(function(){
    var pb=document.getElementById('progress-bar-wrap');
    if(pb) pb.classList.add('visible');
  },4000);
});
</script>
